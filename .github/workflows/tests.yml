name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      # 1️⃣ Checkout the repository
      - uses: actions/checkout@v4

      # 2️⃣ Set up Python version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3️⃣ Install system dependencies for C extensions
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      # 4️⃣ Install pip, setuptools, wheel, numpy
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel numpy

      # 5️⃣ Ensure wheel is available for building extensions
      - name: Ensure wheel is installed
        run: python -m pip install --upgrade wheel

      # 6️⃣ Install csxtools package with dev/CI extras, force compilation
      - name: Install package (with dev & CI extras)
        working-directory: ${{ github.workspace }}
        run: |
          pip install --upgrade --force-reinstall --no-binary :all: ".[dev,ci]"

      # 7️⃣ Verify compiled extensions exist
      - name: List compiled extensions
        run: ls -lh csxtools/ext || true

      # 8️⃣ Run tests with coverage
      - name: Run tests with coverage
        run: |
          set -vxeuo pipefail
          coverage run --source=csxtools run_tests.py
          coverage report -m

      # 9️⃣ Optional: generate coverage.xml for Codecov
      # - name: Generate coverage XML
      #   run: coverage xml

      #  🔟 Optional: upload coverage to Codecov
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     file: ./coverage.xml
      #     flags: unittests
