[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "numpy",
    "versioneer[toml]>=0.28"
]
build-backend = "setuptools.build_meta"
[tool.ruff]
exclude = [
    "examples",
    "doc",
    "build",
    "dist",
    "csxtools.egg-info",
    "__pycache__"
]
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.4.0",
]

docs = [
    "sphinx",
    "sphinx-bootstrap-theme",
]

ci = [
    "codecov",
    "coveralls",
]
